[project]
name = "model-diff"
version = "0.1.0"
description = "Reproducible, tamper-evident evidence of how classification outputs change when an LLM provider upgrades a model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13.0",
    "datasets>=5.1.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
model-diff = "model_diff.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_diff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
